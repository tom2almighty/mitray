[Mihomo]
; 首次使用可直接在设置面板选择路径。相对路径以 MiTray 所在目录为准。
CorePath=
ConfigPath=
ConfigURL=
ActiveProfile=default

[Profiles]
; default=D:\Program\Mihomo\config.yaml

[Settings]
AutoStartCore=1
; off / normal / admin；开机自启通过设置面板或托盘菜单应用。
AutoStartupLevel=off
AutoStartupDelaySec=15

[State]
Schema=1
; 无 TUNEnabled：遵循 YAML；托盘成功切换后自动保存为 0 或 1。
