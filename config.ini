[Mihomo]
; ============================================================================
; Mihomo 核心配置
; ============================================================================

; mihomo 可执行文件的完整路径(必填)
; 示例 Windows 路径:
CorePath=D:\Program\Mihomo\mihomo-windows-amd64.exe
; 或相对路径:
; CorePath=.\mihomo\mihomo.exe

; 当前使用的本地配置名称
; 如果 ConfigURL 已填写，远程配置仍然优先
ActiveProfile=default

; 本地配置文件路径(ConfigPath 和 ConfigURL 二选一)
; 如果同时配置,ConfigURL 优先级更高
ConfigPath=D:\Program\Mihomo\config.yaml
; 或相对路径:
; ConfigPath=.\config.yaml

; 远程配置文件 URL(可选,订阅链接)
; 如果配置了 URL,会自动下载并使用,优先级高于 ConfigPath
; ConfigURL=https://example.com/clash/config.yaml


[Profiles]
; ============================================================================
; 本地 mihomo 配置文件列表
; 托盘菜单「选择 mihomo 配置」会读取这里
; ============================================================================
default=D:\Program\Mihomo\config.yaml
; work=D:\Program\Mihomo\work.yaml


[Settings]
; ============================================================================
; 程序设置
; ============================================================================

; 程序启动时自动启动 mihomo 核心
; 1 = 是(推荐),0 = 否
AutoStartCore=1

; TUN 控制来源（不会修改 mihomo 配置文件）
; runtime = MiTray 通过 mihomo API 接管 TUN 开关
; file    = 跟随 YAML 中的 tun.enable
TUNControl=runtime

; TUNControl=runtime 时的目标 TUN 状态（托盘开关成功后自动更新）
; 1 = 开启,0 = 关闭
TUNEnabled=0

; 开机登录后延迟启动秒数（0-600）
AutoStartupDelaySec=15
