name: Build MiTray

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Windows executable
        shell: pwsh
        env:
          MITRAY_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: ./build.ps1 -Version $env:MITRAY_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: mitray-windows-amd64
          path: dist/mitray.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mitray-windows-amd64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/mitray.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
